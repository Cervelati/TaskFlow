<!DOCTYPE html>
<html lang="pt-BR" data-theme="blue">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow – Meu Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
</head>

<body data-theme="blue">

    <div class="db">

        <!-- ══════════════ SIDEBAR ══════════════ -->
        <aside class="sidebar">

            <!-- Logo -->
            <div class="sidebar-logo">
                <div class="logo-icon">
                    <div class="logo-col"></div>
                    <div class="logo-col"></div>
                    <div class="logo-col"></div>
                </div>
                <span class="logo-text">TaskFlow</span>
            </div>

            <!-- Navigation -->
            <nav class="sidebar-nav">
                <div class="nav-item active" onclick="setActiveNav(this)">
                    <span class="nav-icon">⊞</span> Meu board
                </div>
                <div class="nav-item" onclick="setActiveNav(this)">
                    <span class="nav-icon">☑</span> Tarefas
                </div>
                <div class="nav-item" onclick="location.href='notification.html'">
                    <span class="nav-icon">🔔</span> Notificações
                </div>
                <div class="nav-item" onclick="setActiveNav(this)">
                    <span class="nav-icon">⚙</span> Configurações
                </div>
            </nav>

            <!-- ── THEME SECTION ── -->
            <div class="theme-section">
                <div class="theme-label">Aparência</div>

                <div class="mode-row">
                    <button class="mode-btn active" id="btn-dark-mode" title="Modo Escuro"
                        onclick="setMode('dark-mode')">
                        <span>🌙</span> Escuro
                    </button>
                    <button class="mode-btn" id="btn-light-mode" title="Modo Claro" onclick="setMode('light-mode')">
                        <span>☀️</span> Claro
                    </button>
                </div>

                <div class="theme-label" style="margin-top:12px;">Cor do board</div>
                <div class="theme-options" id="theme-options">
                    <button class="theme-btn active" data-theme="blue" style="background:#0052CC" title="Azul"
                        onclick="setTheme('blue',this)"></button>
                    <button class="theme-btn" data-theme="teal" style="background:#008DA6" title="Teal"
                        onclick="setTheme('teal',this)"></button>
                    <button class="theme-btn" data-theme="green" style="background:#0B6E4F" title="Verde"
                        onclick="setTheme('green',this)"></button>
                    <button class="theme-btn" data-theme="purple" style="background:#403294" title="Roxo"
                        onclick="setTheme('purple',this)"></button>
                    <button class="theme-btn" data-theme="slate" style="background:#2C3E50" title="Slate"
                        onclick="setTheme('slate',this)"></button>
                    <button class="theme-btn" data-theme="crimson" style="background:#8B1A2B" title="Crimson"
                        onclick="setTheme('crimson',this)"></button>
                    <button class="theme-btn" data-theme="midnight" style="background:#1A1A2E" title="Midnight"
                        onclick="setTheme('midnight',this)"></button>
                </div>
            </div>

            <!-- User -->
            <div class="sidebar-user">
                <div class="user-avatar" id="user-avatar">LH</div>
                <div class="user-info">
                    <div class="user-name" id="user-name">Luiz Henrique</div>
                    <div class="user-role">Developer</div>
                </div>
                <button class="btn-logout" title="Sair" onclick="handleLogout()">⇥</button>
            </div>

        </aside>

        <!-- ══════════════ MAIN ══════════════ -->
        <div class="main">

            <div class="topbar">
                <span class="topbar-title">📋 Meu Board</span>
                <button class="btn-new" onclick="openModal()">+ Nova tarefa</button>
            </div>

            <div class="kanban" id="kanban-board">

                <div class="column" id="col-todo" data-col="todo">
                    <div class="col-header">
                        <span class="col-title">🚀 A fazer</span>
                        <span class="col-count" id="count-todo">0</span>
                    </div>
                    <div class="cards-list" id="list-todo"></div>
                    <button class="add-card-btn" onclick="openModal('todo')">+ Adicionar tarefa</button>
                </div>

                <div class="column" id="col-progress" data-col="progress">
                    <div class="col-header">
                        <span class="col-title">⚡ Em andamento</span>
                        <span class="col-count" id="count-progress">0</span>
                    </div>
                    <div class="cards-list" id="list-progress"></div>
                    <button class="add-card-btn" onclick="openModal('progress')">+ Adicionar tarefa</button>
                </div>

                <div class="column" id="col-done" data-col="done">
                    <div class="col-header">
                        <span class="col-title">✅ Concluído</span>
                        <span class="col-count" id="count-done">0</span>
                    </div>
                    <div class="cards-list" id="list-done"></div>
                    <button class="add-card-btn" onclick="openModal('done')">+ Adicionar tarefa</button>
                </div>

            </div>
        </div>
    </div>

    <!-- ══════════════ LOGOUT MODAL ══════════════ -->
    <div class="modal-overlay hidden" id="logout-overlay">
        <div class="modal logout-modal">
            <div class="logout-icon-wrap">
                <div class="logout-icon">⇥</div>
            </div>
            <div class="logout-body">
                <h3 class="logout-title">Sair da conta?</h3>
                <p class="logout-desc">Você será redirecionado para a página de login. Seu progresso está salvo.</p>
            </div>
            <div class="logout-footer">
                <button class="btn-cancel" onclick="closeLogout()">Cancelar</button>
                <button class="btn-logout-confirm" onclick="confirmLogout()">
                    <span id="logout-label">Sair</span>
                    <span class="spinner hidden" id="logout-spinner"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- ══════════════ MODAL ══════════════ -->
    <div class="modal-overlay hidden" id="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Nova tarefa</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="task-title">Título *</label>
                    <input type="text" id="task-title" placeholder="Descreva a tarefa..." maxlength="120" />
                </div>
                <div class="form-group">
                    <label for="task-tag">Tag</label>
                    <select id="task-tag">
                        <option value="frontend">Frontend</option>
                        <option value="backend">Backend</option>
                        <option value="design">Design</option>
                        <option value="urgente">Urgente</option>
                        <option value="devops">DevOps</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-date">Data limite</label>
                    <input type="date" id="task-date" />
                </div>
                <div class="form-group">
                    <label for="task-col">Coluna</label>
                    <select id="task-col">
                        <option value="todo">A fazer</option>
                        <option value="progress">Em andamento</option>
                        <option value="done">Concluído</option>
                    </select>
                </div>
                <div class="error-msg" id="error-msg">⚠ O título é obrigatório.</div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-save" id="btn-save" onclick="saveTask()">
                    <span id="save-label">Salvar tarefa</span>
                    <span class="spinner hidden" id="save-spinner"></span>
                </button>
            </div>
        </div>
    </div>

    <script src="assets/js/dashboard.js"></script>
</body>

</html>
